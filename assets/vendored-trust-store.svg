<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="240" viewBox="0 0 1120 240" role="img" aria-labelledby="title desc">
  <title id="title">A CA bundle inside an installed package</title>
  <desc id="desc">The installed pip package contains pip/_vendor/certifi/cacert.pem. Updating the separate operating system trust store does not replace this file.</desc>
  <rect x="2" y="2" width="720" height="236" rx="12" fill="#eee8f4" stroke="#a58ab9" stroke-width="2"/>
  <rect x="26" y="60" width="672" height="154" rx="10" fill="#faf9fc" stroke="#a58ab9" stroke-width="2"/>
  <rect x="52" y="118" width="620" height="72" rx="8" fill="#57068c"/>
  <rect x="778" y="2" width="340" height="236" rx="12" fill="#f1f0f3" stroke="#b6aebd" stroke-width="2"/>
  <g font-family="Arial, Helvetica, sans-serif">
    <text x="26" y="38" fill="#57068c" font-size="26" font-weight="700">Installed <tspan font-family="Menlo, Consolas, monospace">pip</tspan> Package</text>
    <text x="52" y="96" fill="#57068c" font-size="24">Vendored <tspan font-family="Menlo, Consolas, monospace">certifi</tspan></text>
    <text x="362" y="147" text-anchor="middle" fill="#fff" font-size="20" font-family="Menlo, Consolas, monospace">pip/_vendor/certifi/cacert.pem</text>
    <text x="362" y="176" text-anchor="middle" fill="#fff" font-size="21">A copied set of trusted CA certificates</text>
    <g text-anchor="middle">
      <text x="948" y="52" fill="#57068c" font-size="25" font-weight="700">OS Trust Store</text>
      <text x="948" y="102" fill="#241b30" font-size="23">Updated separately</text>
      <text x="948" y="155" fill="#574563" font-size="21">Does not replace the</text>
      <text x="948" y="184" fill="#574563" font-size="21">file bundled with <tspan font-family="Menlo, Consolas, monospace">pip</tspan></text>
    </g>
  </g>
</svg>
